<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Target Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.12);
        }

        .target-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(6, 182, 212, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.825rem;
            color: var(--text-muted);
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-badge span {
            color: var(--text-light);
            font-weight: 600;
        }

        #map {
            flex: 1;
            width: 100%;
            background: #090d16;
        }

        /* Custom Leaflet Map styling for Dark Theme */
        .leaflet-container {
            background: #0f172a !important;
        }

        .leaflet-bar a {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <a href="/" class="back-btn">← Back</a>
            <div class="target-title">Target: <span id="display-id">Loading...</span></div>
            <div class="status-pill" id="status-pill">
                <span class="pulse-dot"></span>
                <span id="status-text">LIVE CONNECTED</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-badge">Coordinates: <span id="stat-coords">--</span></div>
            <div class="stat-badge">Updates: <span id="stat-updates">0</span></div>
            <div class="stat-badge">Last Ping: <span id="stat-ping">Just now</span></div>
        </div>
    </header>

    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const displayId = document.querySelector("#display-id")
        const statusText = document.querySelector("#status-text")
        const statCoords = document.querySelector("#stat-coords")
        const statUpdates = document.querySelector("#stat-updates")
        const statPing = document.querySelector("#stat-ping")

        const urlParams = new URLSearchParams(location.search)
        const id = urlParams.get("id") || "{{ id }}"
        displayId.innerText = id

        // Parse initial data
        let initialLocation = [0, 0]
        let initialHistory = []
        try {
            initialLocation = JSON.parse(`{{ data }}`) || [0, 0]
            initialHistory = JSON.parse(`{{ history }}`) || []
        } catch (e) {
            console.log("Parse error", e)
        }

        // Initialize Map
        const map = L.map('map').setView(initialLocation, 16)

        // Dark/Standard OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map)

        // Create Custom Target Marker Pin
        const targetIcon = L.divIcon({
            className: 'custom-target-icon',
            html: `<div style="
                width: 20px; 
                height: 20px; 
                background: #06b6d4; 
                border: 3px solid #ffffff; 
                border-radius: 50%; 
                box-shadow: 0 0 15px #06b6d4, 0 0 30px #06b6d4;
            "></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        })

        const marker = L.marker(initialLocation, { icon: targetIcon }).addTo(map)

        // Movement Polyline (Trail)
        const polylinePoints = initialHistory.map(pt => [pt[0], pt[1]])
        const movementTrail = L.polyline(polylinePoints, {
            color: '#06b6d4',
            weight: 4,
            opacity: 0.85,
            smoothFactor: 1
        }).addTo(map)

        if (initialLocation[0] !== 0) {
            statCoords.innerText = `${initialLocation[0].toFixed(4)}, ${initialLocation[1].toFixed(4)}`
        }

        let updateCount = initialHistory.length
        statUpdates.innerText = updateCount

        // Connect Socket.IO for real-time streaming
        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket', 'polling']
        })

        socket.on("map-data", data => {
            if (data.id === id) {
                const latLng = [data.lat, data.lng]
                
                // Update Marker & Map View
                marker.setLatLng(latLng)
                map.panTo(latLng)

                // Update Movement Trail
                movementTrail.addLatLng(latLng)

                // Update Stats
                updateCount++
                statUpdates.innerText = updateCount
                statCoords.innerText = `${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}`
                statPing.innerText = new Date().toLocaleTimeString()

                statusText.innerText = "STREAMING LIVE"
                setTimeout(() => {
                    statusText.innerText = "LIVE CONNECTED"
                }, 1500)
            }
        })
    </script>
</body>

</html>
